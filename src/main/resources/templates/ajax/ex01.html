<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<title>Insert title here</title>
</head>
<body>
	
	<h2>AJAX  테스트</h2>
	
	<label>이름</label><input type="text" id="name" class="">
	<label>생년월일</label><input type="text" id="birth" class="">
	<button type="submit" class="btn btn-success" id="inputBtn">입력</button>
	
	<!--  입력한 이름과 생년월일을 서버에 전달 후, 새로고침없이 가져와서 표시한다. 
	form 태그는 페이지가 새로고침이 발생함. 그래서 사용 불가,  
	form , 에 대응하는 짝궁 model 은 사용 안함, 그러니까  name 정보도 필요없고
	대신 자바스크립트에 대응하는 id 정보로 객체로 가져오자. -->
	
	<div>이름 : <span id="nameSpan"></span> </div>
	<div>나이 : <span id="ageSpan"></span> </div>
	
	
	<!--  자바스크립트를 이용해서 브라우저가 자동으로 하던 작업으로 수동으로 우리가 해주자. 
	왜?
	그래야  원하는 형태를 맞춰줄 수 있어, 
	무한 스크롤 또한 이런 형태 기반이다. -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script>
		
		$("#inputBtn").on("click", function(){
			let name = $("#name").val();
			let birth = $("#birth").val();
			// ajax 를 통해서 요청을 보내는 것, 원래 우리는 웹 브라우저를 통해서 요청을 보내왔음
			// 이렇게 요청을 보내면, 요청 만으로 새로고침이 발생하지 않음. 
			// 서버와 데이터만 주고 받을 수 있게 되는건데 그래서 API 라고 하는 것
			$.ajax({
				type:"get"
				, url:"/ajax/person"  // 이게 요청임,  이 url로 겟 요청 보낸거 
				, data:{"name": name, "birth" : birth} // 이게 요청에 담긴 파라미터, 
				, success: function(response){
					// 응답이 정상적으로 돌아왔을 때에 수행할 기능 작성, 
					// response 에 responseBody 에 담겨있는 정보가 저장이 된다.
					// 지금의 경우, 맵이 담겨 있을거야, 그 맵이 json 문자열로 변환되서 
					// 응답이 돌아왔을 것.
					
					// responsebody 에 담긴 json 문자열을 js 에서 쉽게 사용하도록
					// json 문자열을 js 객체로 변환해줌, 이후 response 에 담아줌.
					
					// 누가? 제이쿼리의 .ajax 함수가 변환
							
					//alert(response.name + " " + response.age);
					
					$("#nameSpan").text(response.name);
					$("#ageSpan").text(response.age);
					
				}
				
			});
		});
		
		
		
		
		
		
	
	
		
	</script>
	
	

</body>
</html>
