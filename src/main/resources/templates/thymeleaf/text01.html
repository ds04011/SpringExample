<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<title>타임리프 문법</title>
</head>
<body>
	
	<h2>test</h2>
	
	<h3>1. 변수</h3>
	<div th:with="num1=36, num2=3">
		<h4 th:text="| 첫 번째 숫자 : ${num1}|"></h4>
		<h4 th:text="| second number : ${num2}|"> </h4>
		
		
		<h4 th:text="|더하기 : ${num1 + num2}|"></h4>
		<h4 th:text="|곱 : ${num1 * num2}|"></h4>
		<h4 th:text="|나누기 : ${num1 / num2}|"></h4>
		<h4 th:text="|빼기 : ${num1 - num2}|"></h4>
		
		<div  th:if="${(num1 + num2) / 2.0  >= 10}"> <h1 th:text="${(num1 + num2) / 2.0}"></h1> </div>
		<div th:unless="${(num1 + num2) / 2.0  >= 10}"> <h3 th:text="${(num1 + num2) / 2.0}"></h3> </div>
		
	</div>
	
	<h4 th:text="|<h3>hihi</h3>|"></h4>
	<div th:utext=" '<h3>hihi</h3>' "></div>
	
	
	
	
	


</body>
</html>
