<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<title>타임리프 문법</title>
</head>
<body>
	
	
	<div class="container">
		<h2>멤버쉽</h2>
		<table class="table text-center">
			<thead>
				<tr>
					<th>이름</th>
					<th>전화번호</th>
					<th>등급</th>
					<th>포인트</th>
					
				</tr>
			</thead>
			
			<tbody>
			
				<tr th:each="member : ${result}">
					<td th:text="${member.name}">손오공</td>
					<td th:text="${member.phoneNumber}">010-1234-1234</td>
					
					<th:block th:switch="${member.grade}">
						<td th:case="VIP" th:text="${member.grade}" class="text-danger"></td>
						<td th:case="GOLD" th:text="${member.grade}" class="text-warning"></td>
						<td th:case="*" th:text="${member.grade}" ></td>
						
					</th:block>
					
					<td th:if="${member.point >= 5000}" th:text="${member.point}" class="text-primary">1204P</td>
					<td th:unless="${member.point >= 5000}" th:text="${member.point}" >1204P</td>
				</tr>
				
			</tbody>
		
		
		</table>
	
	
	</div>
	
	
	
	
	
	
	
	
	
	
	
	

</body>
</html>
