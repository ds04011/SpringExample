<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<title>타임리프 문법</title>
</head>
<body>
	
	
	<h2>날짜, 문자열 다루기</h2>
	
	<h4 th:text="${date}"></h4>
	<h4 th:text="${localDate}"></h4>
	<h4 th:text="${localDateTime}"></h4>
	
	<h4 th:text="${#dates.format(date, 'yyyy, M, d, H 시 m 분 s 초 ')}"></h4>
	<h4 th:text="|LocalDate : ${#temporals.format(localDate, 'yyyy년 MM월 dd일')}|"></h4>
	<h4 th:text="|LocalDateTime : ${#temporals.format(localDateTime, 'yyyy/MM/dd hh:mm:ss' )}|"></h4>
	
	
	<h2>문자열</h2>
	<div th:with="string1 = 'No pain, No gain' ">
		<h4 th:text="| 문자열 길이 : ${#strings.length(string1)} |"></h4>
		<h4 th:text="| No 가 존재하는가 : ${#strings.contains(string1, 'No')} |"></h4>
		
		<h4>특정 문자열로 시작하는가</h4>
		<h4 th:if=" ${#strings.startsWith(string1, 'No')}">dd</h4>
		
	</div>
	
	<div th:with="string2 = 'My dinner is a chicken' ">
		<h4>문자열 치환</h4>
		<h4 th:text="${#strings.replace(string2, 'chicken', 'pizza')}"></h4>
		
		<h4>문자열 자르기</h4>
		<h4 th:text="${#strings.substring(string2, 3, 9)}">dinner</h4>
		
		<h4>문자열 쪼개기</h4>
		<h4 th:text="${#strings.arraySplit(string2, ' ')[2]}"></h4>
		
	</div>
	
	<div th:with="string3 = '     hello      ' ">
	
		<h4 th:text="${string3}"></h4>
		<h4 th:text="${#strings.trim(string3)}">사실 html 은 공백을 제거하고 보여주기 때문에, 
		알아서 trim 을 해서 보여줘서 이럴때에는 필요가 없음, 
		진짜 필요한 경우는 texetarea 같은 곳,  들어갈 때에 공백을 다 보여주기 때문</h4>
		
		<textarea th:text="${string3}"></textarea>
		<textarea th:text="${#strings.trim(string3)}"></textarea>
	</div>
		
	
	
	

</body>
</html>
